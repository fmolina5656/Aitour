<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arquitectura de los casos</title>
<meta name="description" content="La arquitectura de los cinco casos de éxito de Readymind y de la demo del stand, en diagramas paso a paso con el detalle de cada pieza." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" />
<style>
/* Arquitectura de los casos de éxito y de la demo: misma marca que /casos. Los diagramas se arman desde DATA (abajo).
   Todo avanza con clic (o con las flechas / el control remoto de presentaciones): nada pasa solo. */
:root {
  --green: #66de7f; --teal: #53b6ad; --blue: #397ef6;
  --gradient: linear-gradient(90deg, #66de7f 0%, #53b6ad 50%, #397ef6 100%);
  --bg: #050a12; --card: rgba(11, 22, 40, .94); --line: #1f3150; --line-2: #2a4268;
  --text: #f3f6fa; --text-2: #b7c2d2; --text-3: #6f7f95;
  --k-in: #b7c2d2; --k-ai: #397ef6; --k-code: #66de7f; --k-data: #53b6ad; --k-out: #facc15; --k-human: #fb6a3c; --k-sec: #ff5d5d;
  --font: 'Satoshi', 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Cascadia Mono', Consolas, ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
.aurora { position: fixed; inset: -20%; z-index: 0; pointer-events: none; filter: blur(90px); opacity: .45; transition: background 1.2s; }
.app { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto auto auto; grid-template-columns: minmax(0, 1fr); }

.top { display: flex; align-items: center; gap: 24px; padding: 16px 32px 6px; }
.top img { height: 30px; }
.top .t { font-size: 16px; color: var(--text-2); white-space: nowrap; }
.top .t b { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
.tabs { flex: 1; display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs button { font: inherit; font-size: 14px; color: var(--text-2); background: transparent; border: 1px solid var(--line-2); border-radius: 99px; padding: 6px 12px; white-space: nowrap; cursor: pointer; }
.tabs button.on { color: #04121b; background: var(--c); border-color: var(--c); font-weight: 700; }

.head { padding: 10px 32px 0; display: flex; align-items: flex-end; gap: 18px; }
.head .glitch { width: 70px; flex: none; }
.head .glitch img { width: 100%; display: block; filter: drop-shadow(0 8px 22px rgba(102,222,127,.3)); }
.chapter { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
h1 { font-size: clamp(24px, 2.4vw, 38px); line-height: 1.08; letter-spacing: -.02em; margin: 4px 0 0; font-weight: 900; }
h1 em { font-style: normal; color: var(--c); }
.head p { margin: 6px 0 0; color: var(--text-2); font-size: 16.5px; max-width: 1200px; }

/* ---------- Diagrama ---------- */
.stage { position: relative; min-height: 0; margin: 10px 32px 0; }
.diagram { position: absolute; inset: 0; }
.diagram svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.lane-t { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; }
.node { position: absolute; transform: translate(-50%, -50%); width: var(--w); padding: 10px 12px 11px; border-radius: 14px; background: var(--card); cursor: pointer; text-align: left; font: inherit; color: inherit;
  border: 1.5px solid color-mix(in srgb, var(--k) 45%, transparent); box-shadow: 0 8px 26px rgba(0,0,0,.35); transition: border-color .35s, box-shadow .35s, opacity .35s, transform .35s; }
.node:hover { border-color: var(--k); }
.node .ic { font-size: clamp(18px, 1.3vw, 22px); line-height: 1; margin-right: 6px; }
.node b { font-size: clamp(14px, 1vw, 17.5px); line-height: 1.2; }
.node small { display: block; margin-top: 4px; color: var(--text-2); font-size: clamp(12.5px, .85vw, 14.5px); line-height: 1.3; }
.node .tag { position: absolute; top: -10px; right: 10px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--k); color: #04121b; }
.node .more { position: absolute; bottom: 6px; right: 9px; font-size: 11px; color: var(--text-3); }
.diagram.playing .node { opacity: .4; }
.diagram.playing .node.hot, .node.sel { opacity: 1 !important; border-color: var(--k); box-shadow: 0 0 0 4px color-mix(in srgb, var(--k) 22%, transparent), 0 10px 34px color-mix(in srgb, var(--k) 30%, transparent); transform: translate(-50%, -50%) scale(1.04); }
.edge { fill: none; stroke: #34507a; stroke-width: 2; }
.edge.hot { stroke: var(--c); stroke-width: 2.6; stroke-dasharray: 7 7; animation: flow .7s linear infinite; }
.edge.dash { stroke-dasharray: 4 6; }
.diagram.playing .edge:not(.hot) { opacity: .45; }
@keyframes flow { to { stroke-dashoffset: -14; } }
.arrow { fill: #34507a; } .arrow.hot { fill: var(--c); }

/* ---------- Ficha de cada pieza ---------- */
.detail { position: fixed; z-index: 5; right: 24px; top: 170px; width: min(420px, calc(100vw - 32px)); max-height: calc(100dvh - 200px); overflow: auto;
  background: #0a1526; border: 1.5px solid var(--k); border-radius: 18px; padding: 18px 20px 20px; box-shadow: 0 24px 70px rgba(0,0,0,.6);
  transform: translateX(30px); opacity: 0; visibility: hidden; transition: .3s; }
.detail.on { transform: none; opacity: 1; visibility: visible; }
.detail .k { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--k); }
.detail h3 { margin: 6px 0 4px; font-size: 22px; }
.detail .s { color: var(--text-2); font-size: 15px; margin: 0 0 10px; }
.detail ul { margin: 0; padding-left: 18px; line-height: 1.55; font-size: 15.5px; }
.detail li { margin: 4px 0; }
.detail .x { position: absolute; top: 10px; right: 12px; font: inherit; font-size: 22px; color: var(--text-3); background: none; border: 0; cursor: pointer; }

/* ---------- Base, pasos y leyenda ---------- */
.base { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 32px 0; padding: 8px 12px; border: 1px dashed var(--line-2); border-radius: 12px; font-size: 13.5px; color: var(--text-2); }
.base b { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-right: 4px; }
.base span { padding: 3px 9px; border-radius: 99px; background: rgba(57,126,246,.1); border: 1px solid rgba(57,126,246,.35); }
.steps { display: flex; gap: 8px; padding: 10px 32px 0; }
.steps button { flex: 1; text-align: left; font: inherit; color: var(--text-2); background: rgba(9,18,33,.7); border: 1px solid var(--line); border-radius: 12px; padding: 8px 11px; cursor: pointer; font-size: 13.5px; line-height: 1.3; }
.steps button b { display: block; font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .08em; margin-bottom: 2px; }
.steps button.on { border-color: var(--c); color: var(--text); box-shadow: inset 0 0 0 1px var(--c); }
.steps button.on b { color: var(--c); }
.steps .nav { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--text); min-width: 54px; text-align: center; }
.steps .nav.next { background: var(--c); color: #04121b; border-color: var(--c); min-width: 140px; }
.foot { display: flex; align-items: center; gap: 18px; padding: 8px 32px 12px; color: var(--text-3); font-size: 13px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; }
.legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--k); margin-right: 6px; vertical-align: -1px; }
.foot .note { margin-left: auto; }
.foot button { font: inherit; font-size: 13px; color: var(--text-2); background: transparent; border: 1px solid var(--line-2); border-radius: 99px; padding: 5px 12px; cursor: pointer; }

@media (max-width: 900px) {
  body { overflow-x: hidden; overflow-y: auto; }
  .app { height: auto; min-height: 100dvh; }
  .top { flex-wrap: wrap; padding: 12px 16px 4px; } .top .t { white-space: normal; } .tabs { flex-basis: 100%; }
  .head, .steps, .foot { padding-left: 16px; padding-right: 16px; } .stage { margin: 14px 16px 0; height: var(--mh, 900px); } .base { margin: 10px 16px 0; }
  .head .glitch { display: none; } .steps { flex-wrap: wrap; } .steps button { flex-basis: 45%; } .steps .nav.next { flex-basis: 100%; }
  .node { padding: 9px 8px; } .node b { font-size: 13.5px; } .node small { font-size: 11.5px; } .node .ic { display: block; margin-bottom: 4px; } .node .more { display: none; }
  .detail { left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; max-height: 70dvh; transform: translateY(30px); }
}
@media print {
  @page { size: landscape; margin: 10mm; }
  body { overflow: visible; background: #050a12; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .tabs, .foot button, .steps .nav, .detail { display: none; }
}
</style>
</head>
<body>
<div class="aurora" id="aurora"></div>
<div class="app">
  <div class="top">
    <img src="/brand/readymind-logo-dark.png" alt="Readymind" />
    <div class="t"><b>Arquitectura</b> · cómo está hecho</div>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <div class="head">
    <div class="glitch"><img src="/brand/glitch-open.webp" alt="Glitch, la mascota de Readymind" /></div>
    <div><div class="chapter" id="chap"></div><h1 id="title"></h1><p id="sub"></p></div>
  </div>
  <div class="stage"><div class="diagram" id="dia"></div></div>
  <div class="base" id="base"></div>
  <div class="steps" id="steps"></div>
  <div class="foot">
    <div class="legend">
      <span style="--k:var(--k-in)">Entrada</span><span style="--k:var(--k-ai)">IA en Azure / Foundry</span><span style="--k:var(--k-code)">Código y reglas</span>
      <span style="--k:var(--k-data)">Datos</span><span style="--k:var(--k-human)">Persona</span><span style="--k:var(--k-out)">Salida e integración</span><span style="--k:var(--k-sec)">Seguridad</span>
    </div>
    <span class="note">Sin datos de clientes · clic en una pieza para ver su detalle · → siguiente paso</span>
    <button id="bPrint">🖨 Imprimir / PDF</button>
  </div>
</div>
<aside class="detail" id="detail" aria-live="polite"></aside>

<script>

  const $ = (id) => document.getElementById(id)
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  const KV = { in: 'var(--k-in)', ai: 'var(--k-ai)', code: 'var(--k-code)', data: 'var(--k-data)', out: 'var(--k-out)', human: 'var(--k-human)', sec: 'var(--k-sec)' }
  const KN = { in: 'Entrada', ai: 'IA en Azure / Foundry', code: 'Código y reglas', data: 'Datos', out: 'Salida e integración', human: 'Persona', sec: 'Seguridad' }
  let cur = 0, step = -1  // step -1 = vista general (todo encendido)

  $('tabs').innerHTML = DATA.map((d, i) => `<button style="--c:${d.c}" data-i="${i}">${d.key === 'demo' ? '' : 'Caso ' + (i + 1) + ' · '}${d.tab}</button>`).join('')
  $('tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) go(+b.dataset.i) }

  function render() {
    const d = DATA[cur], dia = $('dia')
    document.documentElement.style.setProperty('--c', d.c)
    $('aurora').style.background = `radial-gradient(40% 40% at 20% 20%, ${d.c}55, transparent 70%), radial-gradient(40% 40% at 85% 70%, #397ef640, transparent 70%)`
    $('chap').textContent = d.chap; $('title').innerHTML = d.title; $('sub').textContent = d.sub
    $('base').innerHTML = `<b>Corre sobre</b>${d.base.map((x) => `<span>${esc(x)}</span>`).join('')}`
    document.querySelectorAll('#tabs button').forEach((b, i) => b.classList.toggle('on', i === cur))
    document.querySelector('#tabs button.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' })
    const narrow = innerWidth <= 900, L = d.lanes.length
    // en el celular las columnas pasan a filas: la altura depende de cuántas haya
    document.documentElement.style.setProperty('--mh', `${L * 150}px`)
    let html = '<svg id="svg"></svg>'
    d.lanes.forEach((lane, li) => {
      const along = (li + .5) / L * 100, n = lane.n.length
      if (!narrow) html += `<div class="lane-t" style="left:${along}%">${lane.t}</div>`
      lane.n.forEach((nd, ni) => {
        const across = (ni + .5) / n
        const gap = Math.min(30, 84 / n)
        const [x, y] = narrow ? [across * 100, along] : [along, 54 + (ni - (n - 1) / 2) * gap]
        const w = narrow ? `min(calc(${100 / n}% - 8px), 320px)` : `min(${88 / L}vw, 280px)`
        html += `<button class="node" id="n-${nd.id}" data-id="${nd.id}" style="left:${x}%;top:${y}%;--k:${KV[nd.k]};--w:${w}">${nd.tag ? `<span class="tag">${nd.tag}</span>` : ''}<span class="ic">${nd.ic}</span><b>${esc(nd.t)}</b><small>${esc(nd.s)}</small>${nd.d ? '<span class="more">ⓘ</span>' : ''}</button>`
      })
    })
    dia.innerHTML = html
    $('steps').innerHTML = `<button class="nav" data-i="-1" title="Vista general">◎</button>` +
      d.steps.map((s, i) => `<button data-i="${i}"><b>PASO ${i + 1}</b>${esc(s.t)}</button>`).join('') +
      `<button class="nav next" id="bNext"></button>`
    $('steps').onclick = (e) => {
      const b = e.target.closest('button'); if (!b) return
      if (b.id === 'bNext') next(); else setStep(+b.dataset.i)
    }
    closeDetail()
    requestAnimationFrame(edges)
    setStep(-1)
  }

  function edges() {
    const d = DATA[cur], dia = $('dia'), svg = $('svg'); if (!svg) return
    const R = dia.getBoundingClientRect(), narrow = innerWidth <= 900
    const box = (id) => { const r = $('n-' + id).getBoundingClientRect(); return { x: r.left - R.left, y: r.top - R.top, w: r.width, h: r.height } }
    let out = ''
    d.e.forEach(([a, b, dash]) => {
      const A = box(a), B = box(b)
      const sameLane = narrow ? Math.abs(A.y + A.h / 2 - (B.y + B.h / 2)) < 30 : Math.abs(A.x - B.x) < 10
      let p, ex, ey, ang
      if (sameLane && !narrow) { // misma columna: vertical
        const x = A.x + A.w / 2
        if (B.y > A.y) { p = `M${x},${A.y + A.h} L${x},${B.y - 6}`; ex = x; ey = B.y; ang = 90 }
        else { p = `M${x},${A.y} L${x},${B.y + B.h + 6}`; ex = x; ey = B.y + B.h; ang = -90 }
      } else if (sameLane) { // celular, misma fila: horizontal
        if (B.x > A.x) { p = `M${A.x + A.w},${A.y + A.h / 2} L${B.x - 6},${B.y + B.h / 2}`; ex = B.x; ey = B.y + B.h / 2; ang = 0 }
        else { p = `M${A.x},${A.y + A.h / 2} L${B.x + B.w + 6},${B.y + B.h / 2}`; ex = B.x + B.w; ey = B.y + B.h / 2; ang = 180 }
      } else if (narrow) {
        const down = B.y > A.y
        const x1 = A.x + A.w / 2, y1 = down ? A.y + A.h : A.y, x2 = B.x + B.w / 2, y2 = down ? B.y : B.y + B.h, m = (y1 + y2) / 2
        p = `M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${down ? y2 - 6 : y2 + 6}`; ex = x2; ey = y2; ang = down ? 90 : -90
      } else {
        const fwd = B.x > A.x
        const x1 = fwd ? A.x + A.w : A.x, y1 = A.y + A.h / 2, x2 = fwd ? B.x : B.x + B.w, y2 = B.y + B.h / 2, m = (x1 + x2) / 2
        p = `M${x1},${y1} C${m},${y1} ${m},${y2} ${fwd ? x2 - 6 : x2 + 6},${y2}`; ex = x2; ey = y2; ang = fwd ? 0 : 180
      }
      out += `<path class="edge${dash ? ' dash' : ''}" data-a="${a}" data-b="${b}" d="${p}"/>`
      out += `<path class="arrow" data-a="${a}" data-b="${b}" transform="translate(${ex},${ey}) rotate(${ang})" d="M0,0 L-9,-5 L-9,5 Z"/>`
    })
    svg.innerHTML = out
    paint()
  }

  function paint() {
    const steps = DATA[cur].steps
    $('dia').classList.toggle('playing', step >= 0)
    const hot = new Set(step >= 0 ? steps[step].n : [])
    const prev = new Set(step > 0 ? steps[step - 1].n : [])
    document.querySelectorAll('.node').forEach((n) => n.classList.toggle('hot', hot.has(n.dataset.id)))
    // se enciende la conexión que entra a un nodo activo desde otro activo o desde el paso anterior
    document.querySelectorAll('#svg [data-a]').forEach((p) => p.classList.toggle('hot', hot.has(p.dataset.b) && (hot.has(p.dataset.a) || prev.has(p.dataset.a))))
    document.querySelectorAll('#steps button[data-i]').forEach((b) => b.classList.toggle('on', +b.dataset.i === step))
    const last = step === steps.length - 1
    $('bNext').textContent = step < 0 ? 'Empezar ▶' : last ? (cur < DATA.length - 1 ? `${DATA[cur + 1].tab} ▶` : 'Volver al inicio ▶') : 'Siguiente ▶'
  }
  function setStep(i) { step = i; closeDetail(); paint() }
  function next() { if (step < DATA[cur].steps.length - 1) setStep(step + 1); else go(cur + 1) }
  function prev() { if (step > -1) setStep(step - 1); else go(cur - 1) }
  function go(i) { cur = (i + DATA.length) % DATA.length; history.replaceState(null, '', '#' + DATA[cur].key); render() }

  // ---------- Ficha de cada pieza ----------
  $('dia').addEventListener('click', (e) => {
    const b = e.target.closest('.node'); if (!b) return
    const nd = DATA[cur].lanes.flatMap((l) => l.n).find((x) => x.id === b.dataset.id)
    if (b.classList.contains('sel')) return closeDetail()
    document.querySelectorAll('.node.sel').forEach((x) => x.classList.remove('sel')); b.classList.add('sel')
    const el = $('detail')
    el.style.setProperty('--k', KV[nd.k])
    el.innerHTML = `<button class="x" aria-label="Cerrar">×</button><div class="k">${nd.tag ? esc(nd.tag) : KN[nd.k]}</div>
      <h3>${nd.ic} ${esc(nd.t)}</h3><p class="s">${esc(nd.s)}</p>${nd.d ? `<ul>${nd.d.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}`
    el.classList.add('on')
  })
  $('detail').addEventListener('click', (e) => { if (e.target.closest('.x')) closeDetail() })
  function closeDetail() { $('detail').classList.remove('on'); document.querySelectorAll('.node.sel').forEach((x) => x.classList.remove('sel')) }

  addEventListener('keydown', (e) => {
    // flechas y Av Pág / Re Pág: también sirven con un control remoto de presentaciones
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next() }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev() }
    else if (e.key === 'Escape') closeDetail()
    else if (e.key.toLowerCase() === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.()
  })
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const s = step; render(); setStep(s) }, 150) })
  $('bPrint').onclick = () => print()
  // #caso1 … #caso5 y #demo; también #1 … #5 (casos) y #0 (demo), como en /casos
  const fromHash = () => {
    const h = location.hash.slice(1), k = DATA.findIndex((d) => d.key === h)
    if (k >= 0) return k
    const n = parseInt(h, 10)
    return n >= 1 && n <= 5 ? n - 1 : n === 0 ? DATA.length - 1 : 0
  }
  addEventListener('hashchange', () => { const i = fromHash(); if (i !== cur) go(i) })
  cur = fromHash()
  render(); document.fonts?.ready.then(() => { const s = step; render(); setStep(s) })
})()
