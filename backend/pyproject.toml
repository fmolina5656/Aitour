[project]
name = "readymind-aitour-demo"
version = "0.1.0"
description = "Demo de stand Readymind · Microsoft AI Tour México: enjambre de agentes con Microsoft Foundry"
requires-python = ">=3.12"
dependencies = [
  # Microsoft Agent Framework (GA). agent-framework-foundry reemplaza a agent-framework-azure-ai (congelado en rc6).
  "agent-framework-core==1.20.0",
  "agent-framework-foundry==1.14.0",
  "agent-framework-orchestrations==1.3.0",
  # agent-framework-foundry 1.14 exige azure-ai-projects <2.8; los voice agents (preview) llegan en 2.7.
  "azure-ai-projects[voice]>=2.7.0,<2.8.0",
  "azure-identity>=1.26.0",
  "azure-monitor-opentelemetry>=1.8.10,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
